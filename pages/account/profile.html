<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Music Share</title>
    <link rel="stylesheet" href="profile_styles.css">
</head>
<body>
    <header>
        <a href="../landing/landing.html" class="back-link">← back</a>
        <h1>User Profile</h1>
        <button id="edit-toggle" class="edit-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        </button>
    </header>
    <main>
        <div class="profile-header">
            <div class="profile-picture">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="60" height="60" fill="white">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
            </div>
            <div class="profile-info">
                <h2 id="username">Username</h2>
                <input type="text" id="username-edit" class="edit-field hidden" value="Username">
                <p>Member since: <span id="member-since">January 1, 2023</span></p>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="songs-shared">0</div>
                <div>Songs Shared</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="likes-received">0</div>
                <div>Likes</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="flames-received">0</div>
                <div>Flames</div>
            </div>
        </div>

        <div class="recent-activity">
            <h3>Recent Activity</h3>
            <div id="activity-list"></div>
        </div>

        <div class="favorite-genres">
            <h3>Favorite Genres</h3>
            <div class="genre-list" id="genre-list"></div>
            <div id="genre-edit" class="edit-field hidden">
                <input type="text" id="new-genre" placeholder="Add new genre">
                <button id="add-genre-btn" type="button">Add Genre</button>
            </div>
        </div>

        <div class="settings">
            <h3>Settings</h3>
            <button id="sign-out-btn" class="sign-out-button">Sign Out</button>
        </div>

        <div id="edit-controls" class="hidden">
            <button id="save-changes">Save Changes</button>
            <button id="cancel-edit">Cancel</button>
        </div>
    </main>
    <script src="profile_script.js"></script>
</body>
</html>
